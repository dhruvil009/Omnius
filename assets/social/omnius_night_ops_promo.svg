<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Omnius Night Ops promotional card</title>
  <desc id="desc">A promotional social card for Omnius showing an overnight local orchestration workflow from task queue to isolated worktrees and morning brief.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#101527"/>
      <stop offset="1" stop-color="#061316"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#081018"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20e3b2"/>
      <stop offset="0.46" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#ff7ac8"/>
    </linearGradient>
    <linearGradient id="amberSignal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#1d3144" stroke-width="1" opacity="0.32"/>
    </pattern>
    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        letter-spacing: 0;
      }
      .mono {
        font-family: SFMono-Regular, Consolas, "Liberation Mono", Menlo, monospace;
      }
      .eyebrow {
        fill: #20e3b2;
        font-size: 17px;
        font-weight: 800;
        letter-spacing: 2px;
      }
      .headline {
        fill: #f4f7fb;
        font-size: 62px;
        line-height: 1.02;
        font-weight: 850;
      }
      .subhead {
        fill: #b8c7d9;
        font-size: 24px;
        font-weight: 500;
      }
      .muted {
        fill: #8492a6;
        font-size: 16px;
      }
      .small {
        fill: #a9b7c9;
        font-size: 17px;
      }
      .panelTitle {
        fill: #f4f7fb;
        font-size: 21px;
        font-weight: 760;
      }
      .label {
        fill: #d7e2f0;
        font-size: 16px;
        font-weight: 720;
      }
      .chip {
        fill: #dce8f7;
        font-size: 13px;
        font-weight: 760;
      }
      .terminal {
        fill: #edf6ff;
        font-size: 18px;
        font-weight: 700;
      }
    </style>
  </defs>

  <rect width="1200" height="675" fill="url(#canvas)"/>
  <rect width="1200" height="675" fill="url(#grid)" opacity="0.72"/>
  <path d="M-120 165 C 158 67 282 96 438 189 C 603 287 736 312 941 206 C 1065 142 1181 140 1320 210" fill="none" stroke="#20e3b2" stroke-width="2" opacity="0.25"/>
  <path d="M-80 500 C 159 371 333 385 500 458 C 721 555 846 563 1032 421 C 1126 349 1224 335 1310 362" fill="none" stroke="#ff7ac8" stroke-width="2" opacity="0.2"/>

  <rect x="52" y="48" width="1096" height="579" rx="30" fill="#070b12" opacity="0.58" filter="url(#softShadow)"/>
  <rect x="52" y="48" width="1096" height="579" rx="30" fill="none" stroke="#26384b" stroke-width="1.4"/>

  <g transform="translate(84 80)">
    <rect x="0" y="0" width="146" height="34" rx="17" fill="#0d2e2b" stroke="#20e3b2" opacity="0.95"/>
    <text x="18" y="23" class="chip" fill="#7fffd4">OMNIUS</text>
    <text x="170" y="23" class="muted">local overnight orchestration</text>
  </g>

  <g transform="translate(84 142)">
    <text x="0" y="0" class="eyebrow">NIGHT OPS FOR YOUR REPO</text>
    <text x="0" y="70" class="headline">Your repo worked</text>
    <text x="0" y="136" class="headline">while you slept.</text>
    <text x="0" y="185" class="subhead">Plan local tasks, dispatch isolated workers,</text>
    <text x="0" y="219" class="subhead">and wake up to status, logs, and a brief.</text>
  </g>

  <g transform="translate(84 438)">
    <rect x="0" y="0" width="472" height="76" rx="18" fill="#111827" stroke="#2a3b52"/>
    <text x="24" y="30" class="terminal mono">$ ./omnius_setup.sh &amp;&amp; omnius doctor</text>
    <text x="24" y="56" class="muted">Python 3.11+ · codex/claude · launchd/cron</text>
  </g>

  <g transform="translate(84 545)">
    <rect x="0" y="0" width="142" height="38" rx="19" fill="#162238" stroke="#58a6ff"/>
    <text x="24" y="25" class="chip">task queue</text>
    <rect x="156" y="0" width="128" height="38" rx="19" fill="#132b27" stroke="#20e3b2"/>
    <text x="180" y="25" class="chip">worktrees</text>
    <rect x="298" y="0" width="132" height="38" rx="19" fill="#2a1e11" stroke="#ffd166"/>
    <text x="321" y="25" class="chip">morning brief</text>
  </g>

  <g transform="translate(620 96)">
    <rect x="0" y="0" width="492" height="492" rx="28" fill="url(#panel)" stroke="#2d4058" filter="url(#softShadow)"/>
    <rect x="24" y="22" width="444" height="56" rx="18" fill="#0b111b" stroke="#24364d"/>
    <circle cx="52" cy="50" r="7" fill="#ff5f57"/>
    <circle cx="78" cy="50" r="7" fill="#ffbd2e"/>
    <circle cx="104" cy="50" r="7" fill="#28c840"/>
    <text x="138" y="56" class="small mono">~/.omnius/journal/night-run</text>

    <g transform="translate(42 108)">
      <text x="0" y="0" class="panelTitle">Overnight pipeline</text>
      <text x="408" y="0" class="muted mono" text-anchor="end">21:00 -> 06:30</text>
      <line x1="0" y1="34" x2="408" y2="34" stroke="#1f3146" stroke-width="2"/>
      <path d="M0 34 L82 34 C 110 34 116 73 148 73 L235 73 C 270 73 278 34 312 34 L408 34" fill="none" stroke="url(#signal)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
      <circle cx="0" cy="34" r="8" fill="#20e3b2"/>
      <circle cx="148" cy="73" r="8" fill="#58a6ff"/>
      <circle cx="312" cy="34" r="8" fill="#ff7ac8"/>
      <circle cx="408" cy="34" r="8" fill="#ffd166"/>
    </g>

    <g transform="translate(42 202)">
      <rect x="0" y="0" width="180" height="94" rx="18" fill="#0c1726" stroke="#284261"/>
      <text x="18" y="31" class="label">Plan</text>
      <text x="18" y="58" class="muted">local + recurring tasks</text>
      <path d="M18 75 H138" stroke="#58a6ff" stroke-width="4" stroke-linecap="round"/>

      <rect x="228" y="0" width="180" height="94" rx="18" fill="#0a1c1b" stroke="#1d5c4f"/>
      <text x="246" y="31" class="label">Dispatch</text>
      <text x="246" y="58" class="muted">isolated worktrees</text>
      <path d="M246 75 H366" stroke="#20e3b2" stroke-width="4" stroke-linecap="round"/>

      <path d="M188 47 H218" stroke="url(#signal)" stroke-width="3" stroke-linecap="round"/>
      <path d="M210 39 L222 47 L210 55" fill="none" stroke="#20e3b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(42 316)">
      <rect x="0" y="0" width="408" height="130" rx="20" fill="#111827" stroke="#31425b"/>
      <text x="24" y="38" class="panelTitle">Morning brief</text>
      <g transform="translate(24 62)">
        <rect x="0" y="0" width="140" height="14" rx="7" fill="url(#signal)" opacity="0.88"/>
        <rect x="0" y="24" width="212" height="10" rx="5" fill="#6f7d91" opacity="0.58"/>
        <rect x="0" y="44" width="174" height="10" rx="5" fill="#6f7d91" opacity="0.42"/>
      </g>
      <g transform="translate(262 28)">
        <path d="M0 42 C 22 4 51 10 64 36 C 77 64 105 58 116 26" fill="none" stroke="url(#amberSignal)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
        <text x="58" y="82" class="muted mono" text-anchor="middle">status · logs</text>
      </g>
    </g>
  </g>

</svg>
