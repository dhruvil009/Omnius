[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnius"
version = "0.1.0"
description = "Runner-agnostic overnight orchestration for local development"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
omnius = "omnius.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnius*"]

[tool.setuptools.package-data]
omnius = ["resources/prompts/*.md", "resources/schemas/*.json"]
